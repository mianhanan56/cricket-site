name = "pulsecrease-crex"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[vars]
# Comma-separated browser origins allowed to call this Worker.
# Add your production domain once deployed.
ALLOWED_ORIGINS = "http://localhost:3000,https://pulsecrease.vercel.app"

# No secrets. Every crex endpoint in src/routes.ts is unauthenticated — the
# allowlist, not a token, is what keeps this from being an open relay.

# 8787 is the CricLive Worker's default; keep them on separate ports so both
# can run at once during development.
[dev]
port = 8788

[observability]
enabled = true
